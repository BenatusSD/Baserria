<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baserria</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc063; user-select: none; -webkit-user-select: none; touch-action: none;
  font-family: "Trebuchet MS", Verdana, system-ui, sans-serif; }
#game, #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
#fx { pointer-events: none; z-index: 30; }

#coinbox { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 10;
  padding: 6px 24px 6px 8px; background: rgba(255,248,230,.94); border: 4px solid #7a5230; border-radius: 40px; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
#coinbox canvas { width: 56px; height: 56px; }
#coinNum { font-size: 44px; font-weight: bold; color: #5a3a05; min-width: 1ch; }
#coinbox.bump { animation: bump .22s; }
@keyframes bump { 50% { transform: translateX(-50%) scale(1.12); } }

#carry { position: fixed; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 10; max-width: 34vw; }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 6px; background: rgba(255,248,230,.94); border: 3px solid #7a5230;
  border-radius: 30px; font-size: 30px; font-weight: bold; color: #4a3010; }
.pill canvas { width: 44px; height: 44px; }
.bar { width: 110px; height: 22px; border: 3px solid #4a3010; border-radius: 12px; background: #fff; overflow: hidden; }
.bar > div { height: 100%; background: #6ab04c; }
.pill.full { animation: shake .45s infinite; }
.pill.full .bar > div { background: #e2533d; }
@keyframes shake { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

#tools { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 10; }
#tools button { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #7a5230; background: rgba(255,248,230,.94); cursor: pointer; padding: 9px; }
#tools svg { width: 100%; height: 100%; display: block; }

#menuBack { position: fixed; inset: 0; background: rgba(30,20,5,.3); display: none; align-items: center; justify-content: center; z-index: 20; }
#menuBack.open { display: flex; }
#menu { position: relative; background: #f4e6c8; border: 6px solid #7a5230; border-radius: 22px; padding: 22px 26px 12px; min-width: 300px;
  box-shadow: 0 10px 0 rgba(0,0,0,.25); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.close { position: absolute; top: -24px; right: -24px; width: 54px; height: 54px; border-radius: 50%; background: #e2533d; border: 4px solid #fff; cursor: pointer; padding: 0; }
.close::before, .close::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 6px; background: #fff; border-radius: 3px;
  transform: translate(-50%,-50%) rotate(45deg); }
.close::after { transform: translate(-50%,-50%) rotate(-45deg); }
.row { display: flex; align-items: center; gap: 14px; padding: 10px 4px; }
.row + .row { border-top: 3px dashed #c9a06a; }
.bigred { width: 120px; height: 120px; border-radius: 50%; border: 6px solid #8f2a1c; background: #e2533d; padding: 22px; cursor: pointer;
  box-shadow: 0 5px 0 #8f2a1c; display: block; margin: 8px auto; touch-action: none; -webkit-touch-callout: none; }
.toolbtn { width: 84px; height: 84px; flex: none; margin-left: auto; border-radius: 50%; border: 5px solid #7a5230; background: #e9cb98;
  box-shadow: 0 4px 0 #7a5230; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; }
.toolbtn canvas { width: 64px; height: 64px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 0 10px; }
.card { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 3px solid #d9b98a; border-radius: 16px; background: #fbf1dc; }
.cards + .row { border-top: 3px dashed #c9a06a; }
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 6px; }
.pick { border: 3px solid #d9b98a; border-radius: 16px; background: #fbf1dc; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pick:hover { background: #fff7e6; border-color: #b88c55; }
.pick canvas { width: 76px; height: 76px; }
.toolbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a5230; }
.bigred svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.ring { width: 150px; height: 150px; border-radius: 50%; margin: 6px auto; display: flex; align-items: center; justify-content: center;
  background: conic-gradient(#4a3010 calc(var(--p, 0) * 1%), #e8d6b0 0); }
.ring .bigred { margin: 0; box-shadow: none; }
canvas.ic { width: 84px; height: 84px; flex: none; }
.coinbtn { width: 84px; height: 84px; flex: none; border-radius: 50%; border: 5px solid #a86e10; margin-left: auto; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 40% 35%, #ffe27a, #f2b42c 65%, #d8941a); box-shadow: 0 4px 0 #8a5a0c;
  font: bold 36px "Trebuchet MS", Verdana, sans-serif; color: #5a3a05; }
.coinbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a0c; }
.coinbtn:disabled { filter: grayscale(1); opacity: .4; cursor: default; transform: none; }
.star { width: 84px; height: 84px; flex: none; margin-left: auto; }
.round { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 4px solid #4a3010; padding: 0; cursor: pointer;
  font: bold 34px/1 "Trebuchet MS", Verdana, sans-serif; color: #fff; }
.round.minus { background: #b9b2a4; }
.round.plus { background: #6ab04c; }
.round:disabled { opacity: .3; cursor: default; }
.num { font-size: 42px; font-weight: bold; color: #4a3010; min-width: 1.5ch; text-align: center; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 0 10px; max-width: 420px; margin: 0 auto; }
.slot { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #9b7a4c; }
.slot.full { background: #9b7a4c; }
.slot.new { background: #f2c230; border-color: #c4941a; }
.pips { display: flex; gap: 6px; }
.pip { width: 22px; height: 22px; border-radius: 6px; border: 3px solid #6a8a3c; background: #fff; }
.pip.on { background: #6ab04c; }
.lvl { width: 150px; height: 28px; border: 3px solid #4a3010; border-radius: 14px; background: #fff; overflow: hidden; }
.lvl > div { height: 100%; }

#ver { position: fixed; bottom: 3px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(40,30,10,.4); pointer-events: none; z-index: 5; }

/* touch screens: arrow pad and on/off button (shown only after a touch) */
#touch { display: none; }
body.touch #touch { display: block; }
#pad { position: fixed; left: 18px; bottom: 18px; width: 140px; height: 140px; border-radius: 50%; z-index: 10; touch-action: none;
  background: rgba(255,248,230,.55); border: 4px solid rgba(122,82,48,.7); -webkit-touch-callout: none; }
#pad svg { width: 100%; height: 100%; display: block; pointer-events: none; }
#padKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: rgba(122,82,48,.5); pointer-events: none; }
#enterBtn { position: fixed; right: 22px; bottom: 26px; width: 92px; height: 92px; border-radius: 50%; border: 4px solid #4a3010; z-index: 10;
  background: rgba(255,255,255,.88); padding: 18px; touch-action: none; -webkit-touch-callout: none; }
#enterBtn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
#enterBtn.idle { opacity: .35; }

/* small screens */
@media (max-width: 700px), (max-height: 500px) {
  #coinbox { top: 6px; padding: 3px 16px 3px 5px; border-width: 3px; gap: 6px; }
  #coinbox canvas { width: 38px; height: 38px; }
  #coinNum { font-size: 30px; }
  #carry { top: 6px; left: 6px; gap: 5px; }
  .pill { font-size: 20px; padding: 2px 10px 2px 4px; border-width: 2px; gap: 4px; }
  .pill canvas { width: 30px; height: 30px; }
  .bar { width: 64px; height: 16px; border-width: 2px; }
  #tools { top: 6px; right: 6px; }
  #tools button { width: 40px; height: 40px; padding: 6px; border-width: 2px; }
  #menu { padding: 16px 16px 8px; min-width: 0; border-width: 4px; }
  .close { width: 44px; height: 44px; top: -18px; right: -18px; }
  .row { gap: 8px; padding: 6px 2px; }
  canvas.ic { width: 58px; height: 58px; }
  .card { padding: 4px 6px; gap: 6px; }
  .pick canvas { width: 54px; height: 54px; }
  .picks { gap: 5px; }
  .coinbtn, .star { width: 60px; height: 60px; font-size: 26px; border-width: 4px; }
  .toolbtn { width: 60px; height: 60px; border-width: 4px; }
  .toolbtn canvas { width: 44px; height: 44px; }
  .round { width: 40px; height: 40px; font-size: 26px; border-width: 3px; }
  .num { font-size: 30px; }
  .slot { width: 18px; height: 18px; border-width: 2px; }
  .pip { width: 16px; height: 16px; border-width: 2px; }
  .lvl { width: 100px; height: 22px; }
}
@media (max-height: 420px) {
  .row { padding: 3px 2px; }
  canvas.ic { width: 46px; height: 46px; }
  .cards { gap: 5px; padding-bottom: 4px; }
  .card { padding: 2px 6px; }
  .pick canvas { width: 46px; height: 46px; }
  #menu { padding: 12px 14px 6px; }
  .coinbtn, .star { width: 44px; height: 44px; font-size: 20px; }
  canvas.ic { width: 42px; height: 42px; }
  .slots { padding-bottom: 4px; gap: 4px; }
  .slot { width: 14px; height: 14px; }
  .round { width: 34px; height: 34px; font-size: 22px; }
  .num { font-size: 24px; }
  .pip { width: 13px; height: 13px; }
  .toolbtn { width: 44px; height: 44px; }
  .toolbtn canvas { width: 32px; height: 32px; }
  .coinbtn, .star { width: 50px; height: 50px; font-size: 22px; }
}
@media (max-width: 700px) { #carry { top: 56px; max-width: 90vw; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="coinbox"><canvas id="coinIcon"></canvas><span id="coinNum">0</span></div>
<div id="carry"></div>
<div id="tools"><button id="resetBtn" tabindex="-1"></button><button id="soundBtn" tabindex="-1"></button><button id="fsBtn" tabindex="-1"></button></div>
<div id="menuBack"><div id="menu"></div></div>
<div id="touch">
  <div id="pad">
    <svg viewBox="0 0 100 100" fill="#4a3010" opacity=".75"><path d="M50 8 62 24H38zM50 92 62 76H38zM8 50 24 38V62zM92 50 76 38V62z"/></svg>
    <div id="padKnob"></div>
  </div>
  <button id="enterBtn" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="#4a3010" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4v9H5M10 8l-5 5 5 5"/></svg></button>
</div>
<div id="ver"></div>
<canvas id="fx"></canvas>
<script>
'use strict';

// ======================================================================
// Tunables. Prices, speeds and timings all live here.
// ======================================================================
const CONFIG = {
  startCoins: 2,
  itemsPerCoin: 5,             // customers buy any 5 items for 1 coin
  basket: { size: [10, 15, 20, 25, 30], price: [3, 5, 7, 9] }, // the farmer's basket, upgraded at the house
  maxUpgradeGap: 3,            // no tractor upgrade may get more than this many levels ahead of another
  walkSpeed: 3.2,              // tiles per second
  tractor: {
    speed:   [3.4, 4.0, 4.6, 5.2, 5.8],
    storage: [10, 20, 30, 45, 60],
    yield:   [1, 2, 3, 4, 5],  // items per harvested tile
    price:   [3, 5, 7, 9],     // price of level 2, 3, 4, 5
  },
  crops: {                     // sow = seed price; grow = seconds to ripen; perTile = items per tile (times the tractor's yield)
    carrot:  { sow: 1, grow: 25, perTile: 1 },
    onion:   { sow: 1, grow: 30, perTile: 1 },
    corn:    { sow: 1, grow: 35, perTile: 1 },
    potato:  { sow: 2, grow: 45, perTile: 2 },
    pepper:  { sow: 2, grow: 50, perTile: 2 },
    tomato:  { sow: 3, grow: 55, perTile: 3 },
    pumpkin: { sow: 3, grow: 60, perTile: 3 },
  },
  sowPerSegment: 1,            // each extension adds this to the seed price
  cropExtendPrice: [2, 3, 4, 5, 6],
  penExtendPrice:  [2, 3, 4, 5, 6],
  // price of a female / male; cap = places in a pen, capPerSegment = extra places per extension;
  // produceEvery = seconds per egg, milk, manure or full coat of wool (null: nothing, they are ridden)
  animals: {
    hen:    { price: { f: 4, m: 5 },  cap: 5, capPerSegment: 2, produceEvery: [43, 51], breedEvery: 120, growUp: 90 },
    duck:   { price: { f: 4, m: 5 },  cap: 5, capPerSegment: 2, produceEvery: [50, 60], breedEvery: 120, growUp: 90 },
    goose:  { price: { f: 5, m: 6 },  cap: 4, capPerSegment: 2, produceEvery: [55, 66], breedEvery: 120, growUp: 100 },
    turkey: { price: { f: 5, m: 6 },  cap: 4, capPerSegment: 2, produceEvery: [55, 66], breedEvery: 120, growUp: 100 },
    sheep:  { price: { f: 5, m: 6 },  cap: 4, capPerSegment: 1, produceEvery: [50, 62], breedEvery: 120, growUp: 100 },
    goat:   { price: { f: 6, m: 7 },  cap: 4, capPerSegment: 1, produceEvery: [32, 38], breedEvery: 120, growUp: 100 },
    pig:    { price: { f: 6, m: 7 },  cap: 4, capPerSegment: 1, produceEvery: [34, 41], breedEvery: 120, growUp: 100 },
    pony:   { price: { f: 6, m: 7 },  cap: 3, capPerSegment: 1, produceEvery: null,     breedEvery: 120, growUp: 110 },
    alpaca: { price: { f: 7, m: 8 },  cap: 3, capPerSegment: 1, produceEvery: [55, 66], breedEvery: 120, growUp: 110 },
    donkey: { price: { f: 7, m: 8 },  cap: 3, capPerSegment: 1, produceEvery: null,     breedEvery: 120, growUp: 120 },
    cow:    { price: { f: 8, m: 9 },  cap: 3, capPerSegment: 1, produceEvery: [23, 28], breedEvery: 120, growUp: 120 },
    horse:  { price: { f: 9, m: 10 }, cap: 3, capPerSegment: 1, produceEvery: null,     breedEvery: 120, growUp: 120 },
  },
  limits: { manure: 5, milk: 2 },                     // manure piles per pen, milk per animal; then they wait
  coop: { eggs: [6, 9, 12, 15], price: [3, 5, 7] },   // eggs the nest basket holds at each coop level; price of levels 2–4
  plotPrice: [30, 35, 40, 45, 50],                    // the new land up north: each plot bought costs a bit more
  trees: {                     // grow = seconds from sapling to grown tree; every = seconds per new fruit
    apple:   { price: 5, grow: 150, every: 50 },
    pear:    { price: 6, grow: 150, every: 45 },
    peach:   { price: 7, grow: 150, every: 43 },
    orange:  { price: 8, grow: 150, every: 38 },
    avocado: { price: 9, grow: 150, every: 56 },
  },
  maxFruitPerTree: 4,
  trough: { foodPrice: 1, waterPrice: 1, drainBase: 0.001, drainPerAnimal: 0.0003 }, // a full trough is 1
  cars: { minGap: 3, maxGap: 9 },   // seconds between customers: shorter the fuller the shop
};

// Generated art. When an image exists it replaces the drawn shape.
// Views: down = front, up = back, left, right. width = size in tiles of the left/right view.
const ART = {
  tractor: { down: 'images/tractor-down.webp', up: 'images/tractor-up.webp', left: 'images/tractor-left.webp', right: 'images/tractor-right.webp', width: 1.9 },
  // animation strips (frames side by side), cut from one sheet with tools/cut_sprites.py --sheet
  dog: { left: 'images/dog-left.webp', right: 'images/dog-right.webp', up: 'images/dog-up.webp', down: 'images/dog-down.webp', sit: 'images/dog-sit.webp' },
  // horses: walking right is the left strip mirrored; foals are the mare drawn smaller and lighter
  horse_f: { left: 'images/horse-f-left.webp', up: 'images/horse-f-up.webp', down: 'images/horse-f-down.webp' },
  horse_m: { left: 'images/horse-m-left.webp', up: 'images/horse-m-up.webp', down: 'images/horse-m-down.webp' },
};
const HORSE_FRAMES = { left: 4, up: 2, down: 2 };
const HORSE_SCALE = 1.22 / 180;       // tiles per image pixel: the mare's side view (180 px) as tall as the drawn horse
const HORSE_SEAT = { left: -0.64, right: -0.64, up: -0.92, down: -0.96 };   // where the rider sits in each view
const DOG_FRAMES = { left: 4, right: 4, up: 4, down: 4, sit: 4 };
const DOG_SIT = { left: 0, down: 1, up: 2, right: 3 };   // which sitting frame faces which way
const DOG_SCALE = 0.62 / 160;         // tiles per image pixel: the side view (160 px high) is 0.62 tiles tall

const VERSION = 'v0.12';            // bump with every change, to check a fresh copy has loaded
const SAVE_KEY = 'harvester-save-v3';
const DEV = /[?&]dev\b/.test(location.search);
if (/[?&]reset\b/.test(location.search)) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ======================================================================
// Map layout, in tiles. x grows to the right, y grows down the screen.
// ======================================================================
const W = 48, H = 35, Y0 = -14;   // the map runs from the north woods (y = -14) down to the road verge (y = 35)
const BOUND = { x0: 0.6, y0: -12.5, x1: 47.4, y1: 31 };
const HOUSE = { x: 19, y: 4.6, w: 8, h: 3.4 };
const SHOP = { x: 13, y: 26.4, w: 7, h: 2.6 };
const SHOP_PAD = { x: 13, y: 29, w: 7, h: 2 };
const SHED = { x: 26, y: 26.4, w: 5, h: 2.6 };
const SHED_PAD = { x: 26, y: 29, w: 5, h: 2 };
const JAR = { x: 20.25, y: 28.95 };
const DOGHOUSE = { x: 19.5, y: 10.0 };
const DOG_HOME = { x: 17.5, y: 9.3, w: 11, h: 5.2 };   // the patch in front of the house where the dog potters about
const STOP_X = 16.5;
const STREAM = { y: -6, h: 1, bridge: [26.7, 29.3] };
const TRACKS = [
  { x: 22, y: 8, w: 2, h: 23.2 }, { x: 5, y: 16, w: 38, h: 2 }, { x: 20, y: 7.8, w: 9, h: 1.4 },
  { x: 27, y: -7, w: 2, h: 15.6 }, { x: 4, y: -7, w: 40, h: 1 },
];
// plot: true = land up north that has to be bought first
const PATCHES = {
  field1: { x0: 11, y0: 11, w: 5, h: 4, dir: -1, sign: { x: 16.75, y: 14.7 } },
  field2: { x0: 11, y0: 19, w: 5, h: 4, dir: -1, sign: { x: 16.75, y: 19.6 } },
  field3: { x0: 29, y0: 20, w: 5, h: 4, dir: 1,  sign: { x: 28.3,  y: 20.6 } },
  field4: { plot: true, x0: 13, y0: -3, w: 5, h: 3, dir: -1, sign: { x: 18.75, y: -0.3 } },
  field5: { plot: true, x0: 33, y0: -3, w: 5, h: 3, dir: 1,  sign: { x: 32.3,  y: -2.4 } },
};
const CROPS = Object.keys(CONFIG.crops);
const CROP_COLOR = { carrot: '#ef8a23', onion: '#d9a25a', corn: '#f2c535', potato: '#c99a5a', pepper: '#d93a2a', tomato: '#e2452f', pumpkin: '#f08a24' };
// Any pen can hold any animal from PEN_CHOICES; the meadow always holds sheep.
const PENS = {
  pen1:   { x0: 11, y0: 2, w: 6, h: 7, dir: 'left',  gate: [14.5, 16.5], sign: { x: 17.6, y: 9.75 },  troughs: { x: 11.9, y: 8.15 } },
  pen2:   { x0: 29, y0: 2, w: 5, h: 5, dir: 'right', gate: [29.5, 31.5], sign: { x: 32.3, y: 7.8 },   troughs: { x: 31.9, y: 6.15 } },
  pen3:   { x0: 29, y0: 9, w: 5, h: 6, dir: 'right', gate: [29.5, 31.5], sign: { x: 28.3, y: 15.75 }, troughs: { x: 31.9, y: 14.15 } },
  pen4:   { x0: 41, y0: 8, w: 5, h: 7, dir: 'up',    gate: [41.5, 43.5], sign: { x: 40.4, y: 15.75 }, troughs: { x: 43.9, y: 14.15 } },
  pen5:   { plot: true, x0: 6,  y0: -11.6, w: 5, h: 4.6, dir: 'left',  gate: [6.5, 8.5],   sign: { x: 11.6, y: -6.15 }, troughs: { x: 8.9, y: -7.85 } },
  pen6:   { plot: true, x0: 18, y0: -11.6, w: 5, h: 4.6, dir: 'left',  gate: [18.5, 20.5], sign: { x: 23.6, y: -6.15 }, troughs: { x: 20.9, y: -7.85 } },
  pen7:   { plot: true, x0: 33, y0: -11.6, w: 5, h: 4.6, dir: 'right', gate: [33.5, 35.5], sign: { x: 32.4, y: -6.15 }, troughs: { x: 35.9, y: -7.85 } },
  // an open meadow: no fence or troughs; sheep stay inside, the farmer walks in and out
  meadow: { x0: 40, y0: 19, w: 7, h: 6, dir: 'down', open: true, species: 'sheep', sign: { x: 40.6, y: 18.8 } },
};
// bird: lives with a coop and lays eggs in its nest basket; product: what the farmer collects;
// ride: can be ridden, at this speed; big: needs more room from the fence; pond / mud: what appears in its pen
const SPECIES = {
  hen:    { bird: true, product: 'egg', speed: 0.7 },
  duck:   { bird: true, product: 'egg', speed: 0.6, pond: true },
  goose:  { bird: true, product: 'egg', speed: 0.6, pond: true },
  turkey: { bird: true, product: 'egg', speed: 0.55 },
  pig:    { product: 'manure', speed: 0.55, mud: true },
  goat:   { product: 'milk', speed: 0.6 },
  cow:    { product: 'milk', speed: 0.4, big: true },
  sheep:  { product: 'wool', speed: 0.45 },
  alpaca: { product: 'wool', speed: 0.5, big: true },
  pony:   { ride: 4.6, speed: 0.6 },
  donkey: { ride: 4.2, speed: 0.5, big: true },
  horse:  { ride: 5.2, speed: 0.7, big: true },

const PEN_CHOICES = ['hen', 'duck', 'goose', 'turkey', 'pig', 'goat', 'cow', 'alpaca', 'pony', 'donkey', 'horse'];

let state;

function newGame() {
  const zero = kinds => Object.fromEntries(kinds.map(k => [k, 0]));
  state = {
    v: 1, coins: CONFIG.startCoins, nextId: 1, basketLv: 1,
    player: { mode: 'walk', x: 23, y: 9.6, dir: 'down', carry: zero(CARRY_KINDS), mount: null },
    tractor: { x: 26.4, y: 10.8, dir: 'left', load: zero(CROPS), lv: { speed: 1, storage: 1, yield: 1 } },
    patches: {}, pens: {},
    orchard: SPOTS.map(() => ({ kind: null, age: 0, fruit: 0, t: 0 })),
    shop: { stock: zero(STOCK_KINDS), jar: 0 },
    dog: { x: 20.8, y: 10.6, tx: 20.8, ty: 10.6, dir: 'down', speed: 1.3, waitT: 3 },
    plots: Object.fromEntries(Object.entries({ ...PENS, ...PATCHES }).filter(([, d]) => d.plot).map(([k]) => [k, false])),
  };
  // tiles: growth per tile (-1 = bare soil, 1 = ripe); crops: what was sown on each tile; last: the crop on the sign
  for (const k in PATCHES) {

}

// Adds anything a save from an older version of the game is missing.

function loadGame() {
  let saved = null;
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.v === 1) saved = s;
  } catch (e) {}
  newGame();
  if (saved) { fillMissing(saved, state); state = saved; }
  const p = state.player, m = findMount(p.mount);
  for (const k in PENS) for (const a of state.pens[k].animals) a.ridden = p.mode === 'horse' && !!m && a === m.a;
  if (p.mode === 'horse' && !m) { p.mode = 'walk'; p.mount = null; }
}

let obs = [];

function buildObstacles() {
  obs = [];
  const add = (x0, y0, x1, y1, who = 'all') => obs.push({ x0, y0, x1, y1, who });
  add(HOUSE.x + 0.15, HOUSE.y + 1.0, HOUSE.x + HOUSE.w - 0.15, HOUSE.y + HOUSE.h);
  add(SHOP.x + 0.2, SHOP.y + 0.4, SHOP.x + SHOP.w - 0.2, SHOP.y + SHOP.h);
  add(SHED.x + 0.1, SHED.y + 0.4, SHED.x + SHED.w - 0.1, SHED.y + SHED.h);
  add(JAR.x - 0.22, JAR.y - 0.3, JAR.x + 0.22, JAR.y);
  add(DOGHOUSE.x - 0.5, DOGHOUSE.y - 0.35, DOGHOUSE.x + 0.5, DOGHOUSE.y);
  add(0, STREAM.y, STREAM.bridge[0], STREAM.y + STREAM.h);
  add(STREAM.bridge[1], STREAM.y, W, STREAM.y + STREAM.h);
  for (const t of TREES) add(t.x - 0.2, t.y - 0.15, t.x + 0.2, t.y + 0.08);
  SPOTS.forEach((s, i) => { if (state.orchard[i].kind) add(s.x - 0.2, s.y - 0.15, s.x + 0.2, s.y + 0.08); });
  for (const b of BUSHES) add(b.x - 0.5, b.y - 0.3, b.x + 0.5, b.y + 0.2);
  const t = 0.1;
  for (const k in PENS) {
    if (!owned(k)) continue;
    const d = PENS[k], r = penRect(k), x1 = r.x + r.w, y1 = r.y + r.h;
    add(r.x - 0.15, r.y - 0.15, x1 + 0.15, y1 + 0.15, 'tractor');
    add(r.x - 0.2, r.y - 0.2, x1 + 0.2, y1 + 0.2, 'dog');
    if (d.open) continue;
    add(r.x - t, r.y - t, x1 + t, r.y + t);
    add(r.x - t, r.y - t, r.x + t, y1 + t);
    add(x1 - t, r.y - t, x1 + t, y1 + t);
    add(r.x - t, y1 - t, d.gate[0], y1 + t);
    add(d.gate[1], y1 - t, x1 + t, y1 + t);
    if (isBirdPen(k)) { const c = coopRect(k); add(c.x, c.y + 0.3, c.x + c.w, c.y + c.h); }
  }
}

function blockedAt(x, y, hw, hh, mode) {
  if (x - hw < BOUND.x0 || x + hw > BOUND.x1 || y - hh < BOUND.y0 || y + hh > BOUND.y1) return true;
  for (const o of obs) {
    if (o.who !== 'all' && o.who !== mode) continue;
    if (x + hw > o.x0 && x - hw < o.x1 && y + hh > o.y0 && y - hh < o.y1) return true;
  }
  return false;
}

// Move with collision. When pushing straight into something, slide sideways around
// corners and into gate openings so a child never gets stuck on an edge.
function moveEnt(e, dx, dy, hw, hh, mode) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.08));
  const sx = dx / n, sy = dy / n;
  for (let i = 0; i < n; i++) {
    if (sx) { if (!blockedAt(e.x + sx, e.y, hw, hh, mode)) e.x += sx; else if (!sy) slide(e, sx, 0, hw, hh, mode); }
    if (sy) { if (!blockedAt(e.x, e.y + sy, hw, hh, mode)) e.y += sy; else if (!sx) slide(e, 0, sy, hw, hh, mode); }
  }
}
function slide(e, sx, sy, hw, hh, mode) {

    for (const s of [1, -1]) {
      const nx = e.x + (sy ? s * d : 0), ny = e.y + (sx ? s * d : 0);
      if (!blockedAt(nx, ny, hw, hh, mode) && !blockedAt(nx + sx, ny + sy, hw, hh, mode)) {
        const step = Math.min(d, Math.abs(sx || sy));
        const mx = sy ? s * step : 0, my = sx ? s * step : 0;

        return;
      }
    }
  }
}
function unstick(e, hw, hh, mode) {

  unstick(state.tractor, ...BOX.tractor, 'tractor');
  unstick(state.dog, ...BOX.dog, 'dog');
  if (p.mode === 'tractor') { p.x = state.tractor.x; p.y = state.tractor.y; }
  else unstick(p, ...BOX[p.mode], p.mode === 'horse' ? 'horse' : 'walk');

let actx = null, muted = false, noiseBuf = null;

function ensureAudio() {

function tone(f, dur, o = {}) {

  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(o.vol || 0.1, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq;
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(gn).connect(actx.destination);
  src.start(t0); src.stop(t0 + dur);
}

function iconCanvas(k, px, cls) {
  const c = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1);
  c.width = c.height = Math.round(px * d);
  if (cls) c.className = cls;
  const prev = g; g = c.getContext('2d');

  g = prev;

const FENCE = '#a0703e', FENCE_D = '#6f4826';
function post(x, y, tall) { const h = tall ? 0.68 : 0.56; rect(x - 0.055, y - h + 0.02, 0.11, h, FENCE_D); rect(x - 0.055, y - h + 0.02, 0.11, 0.06, '#c4925a'); }
function fenceH(x0, x1, y) {
  if (x1 - x0 < 0.05) return;
  rect(x0, y - 0.45, x1 - x0, 0.07, FENCE); rect(x0, y - 0.25, x1 - x0, 0.07, FENCE);
  post(x0, y); post(x1, y);
  for (let x = Math.ceil(x0 + 0.3); x < x1 - 0.3; x++) post(x, y);
}
function fenceV(x, y0, y1) { rect(x - 0.04, y0 - 0.45, 0.08, y1 - y0 + 0.2, FENCE); post(x, y1); }

// a leafy crown of overlapping blobs in three shades
function crown(cx, cy, r, base, seed) {
  const blobs = [[0, 0.05, 1], [-0.55, 0.18, 0.68], [0.55, 0.15, 0.7], [-0.32, -0.42, 0.66], [0.34, -0.4, 0.68], [0, 0.42, 0.6], [0.02, -0.62, 0.52]];
  const dark = shade(base, -0.25), light = shade(base, 0.22);
  for (const [bx, by, br] of blobs) circ(cx + bx * r, cy + by * r, br * r * 0.72, dark, OUT);
  for (const [bx, by, br] of blobs) circ(cx + bx * r, cy + by * r - 0.03, br * r * 0.66, base);
  for (const [bx, by, br] of blobs.slice(3)) circ(cx + bx * r - r * 0.12, cy + by * r - r * 0.14, br * r * 0.38, light);
  for (let i = 0; i < 6; i++) {
    const a = hash(seed, i) * 6.28, d = 0.2 + hash(i, seed) * 0.6;
    g.beginPath(); g.arc(cx + Math.cos(a) * d * r, cy + Math.sin(a) * d * r, r * 0.12, 0.3, 2.6); g.strokeStyle = dark; g.lineWidth = 0.02; g.stroke();
  }
}
// a trunk flaring into roots, with bark lines
function trunk(x, y, h, w) {
  poly([[x - w * 1.6, y + 0.01], [x - w * 0.7, y - 0.12], [x - w * 0.6, y - h], [x + w * 0.6, y - h], [x + w * 0.7, y - 0.12], [x + w * 1.6, y + 0.01]], '#7a5230', OUT);
  for (const d of [-0.3, 0.25]) line(x + d * w, y - 0.1, x + d * w * 0.8, y - h * 0.8, '#5e3e22', 0.015);
}
// scenery trees sway gently; about a third of the woods are pines
function drawTree(t) {
  const sw = Math.sin(T * 1.1 + t.x) * 0.03;
  if (t.woods && (t.pine ?? hash(t.x * 10, t.y * 10) < 0.35)) {             // a pine among the round trees
    shadow(t.x, t.y, 0.5, 0.15);
    rect(t.x - 0.07, t.y - 0.35, 0.14, 0.37, '#6b4626');
    const c = '#2f6a3a';
    for (let i = 0; i < 3; i++) {
      const by = t.y - 0.3 - i * 0.42, w = 0.62 - i * 0.14, s = sw * (i + 1) * 0.5;
      poly([[t.x - w + s * 0.5, by], [t.x + s, by - 0.62], [t.x + w + s * 0.5, by]], shade(c, -0.1 * i), OUT);
      poly([[t.x + s * 0.7, by - 0.5], [t.x - w * 0.6 + s * 0.5, by - 0.04], [t.x - w * 0.3 + s * 0.5, by - 0.04]], shade(c, 0.2));
    }
    return;
  }
  shadow(t.x, t.y, 0.6, 0.18);
  trunk(t.x, t.y, 0.75, 0.1);
  line(t.x, t.y - 0.6, t.x - 0.22 + sw, t.y - 0.95, '#7a5230', 0.06); line(t.x + 0.02, t.y - 0.65, t.x + 0.25 + sw, t.y - 1.0, '#7a5230', 0.05);
  crown(t.x + sw, t.y - 1.18, 0.62, t.woods ? (hash(t.x * 7, 3) < 0.5 ? '#3f7a32' : '#467f36') : '#4a8636', t.x * 10 | 0);
}
function drawFruit(kind, x, y, r) {
  if (kind === 'pear') {
    circ(x, y + r * 0.25, r * 0.8, FRUIT_COLOR.pear, OUT);
    circ(x, y - r * 0.45, r * 0.5, FRUIT_COLOR.pear, OUT);
    circ(x, y + r * 0.25, r * 0.78, FRUIT_COLOR.pear);
  } else if (kind === 'avocado') {
    ell(x, y + r * 0.12, r * 0.74, r * 1.0, FRUIT_COLOR.avocado, OUT);
  } else circ(x, y, r, FRUIT_COLOR[kind], OUT);
  circ(x - r * 0.32, y - r * 0.28, r * 0.25, 'rgba(255,255,255,.45)');
  if (kind === 'peach') { line(x, y - r * 0.8, x - r * 0.25, y + r * 0.5, 'rgba(190,80,50,.5)', r * 0.12); circ(x + r * 0.35, y - r * 0.2, r * 0.3, 'rgba(230,90,80,.45)'); }
  if (kind === 'orange') for (let i = 0; i < 3; i++) circ(x - r * 0.3 + i * r * 0.3, y + r * 0.1 - (i % 2) * r * 0.3, r * 0.06, 'rgba(180,90,10,.5)');
  line(x, y - r * (kind === 'pear' ? 0.9 : 0.85), x + r * 0.1, y - r * 1.25, '#6f4826', r * 0.14);
  leafShape(x + r * 0.08, y - r * 1.1, r * 0.7, r * 0.25, -0.5, '#4f9f2f');
}

// a planted fruit tree: growth 0..1 grows the sapling; fruit = ripe fruit hanging on it
function drawFruitTree(x, y, kind, growth, fruit, seed) {
  const s = 0.35 + 0.65 * growth, sw = Math.sin(T * 1.1 + seed) * 0.025;
  shadow(x, y, 0.6 * s, 0.18 * s);
  g.save(); g.translate(x, y); g.scale(s, s);
  trunk(0, 0, 0.72, 0.1);
  line(0, -0.58, -0.2 + sw, -0.9, '#7a5230', 0.055); line(0.02, -0.62, 0.22 + sw, -0.95, '#7a5230', 0.045);
  crown(sw, -1.15, 0.6, LEAF_COLOR[kind], seed);
  const spots = [[-0.32, -1.0], [0.3, -1.12], [0.02, -0.82], [-0.08, -1.42], [0.36, -1.45]];
  for (let j = 0; j < Math.min(fruit, spots.length); j++) drawFruit(kind, sw + spots[j][0], spots[j][1], 0.1);
  g.restore();
}

function drawSpot(i) {
  const sp = SPOTS[i], o = state.orchard[i];
  if (o.kind) { drawFruitTree(sp.x, sp.y, o.kind, Math.min(1, o.age / CONFIG.trees[o.kind].grow), o.fruit, i + 11); return; }
  const hov = hoverId === 'spot-' + i;
  ell(sp.x, sp.y - 0.05, 0.5, 0.22, hov ? '#a8825a' : '#8e6b44', OUT);

function drawGround(v) {
  rect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0, '#7aa951');
  rect(0, Y0, W, H - Y0, '#8cc063');
  rect(0, Y0, W, 2.6, '#6f9f4c');
  const tx0 = Math.max(0, Math.floor(v.x0)), tx1 = Math.min(W - 1, Math.ceil(v.x1));
  const ty0 = Math.max(Y0, Math.floor(v.y0)), ty1 = Math.min(H - 1, Math.ceil(v.y1)), tufts = [[], []];
  for (let ty = ty0; ty <= ty1; ty++) {
    if (ty >= 31 && ty <= 32) continue;
    for (let tx = tx0; tx <= tx1; tx++) {
      const h = hash(tx, ty), h2 = hash(ty + 7, tx + 3);
      if (h < 0.6) {
        const gx = tx + 0.1 + h * 0.8, gy = ty + 0.15 + h2 * 0.75;
        tufts[h2 < 0.5 ? 0 : 1].push(gx, gy);
      }
      if (h > 0.93) {
        const fx = tx + h2 * 0.8 + 0.1, fy = ty + h * 0.5 + 0.2;
        line(fx, fy + 0.06, fx, fy, '#5f9a3a', 0.02);
        if (h2 > 0.66) flower5(fx, fy, 0.03, '#fff', '#f2c230');          // daisy
        else if (h2 > 0.33) flower5(fx, fy, 0.026, '#f7d54a', '#e8a91a');  // buttercup
        else { for (let i = 0; i < 3; i++) circ(fx + Math.cos(i * 2.09) * 0.03, fy + Math.sin(i * 2.09) * 0.03, 0.028, '#6fb04a'); circ(fx, fy - 0.07, 0.03, '#e6a3c8'); }   // clover
      }
    }
  }
  ['#79ad52', '#6fa54a'].forEach((c, i) => {
    const p = tufts[i];
    g.beginPath();
    for (let n = 0; n < p.length; n += 2) {
      const gx = p[n], gy = p[n + 1];
      g.moveTo(gx, gy); g.quadraticCurveTo(gx - 0.04, gy - 0.08, gx - 0.08, gy - 0.12);
      g.moveTo(gx, gy); g.quadraticCurveTo(gx, gy - 0.1, gx + 0.01, gy - 0.16);

    }
    g.strokeStyle = c; g.lineWidth = 0.03; g.lineCap = 'round'; g.stroke();
  });
  for (const t of TRACKS) rrect(t.x, t.y, t.w, t.h, 0.35, '#d9be88');
  for (const t of TRACKS) for (let i = 0; i < t.w * t.h * 0.6; i++) {
    const px = t.x + 0.2 + hash(i, t.x) * (t.w - 0.4), py = t.y + 0.2 + hash(t.y, i) * (t.h - 0.4);
    if (px > v.x0 && px < v.x1 && py > v.y0 && py < v.y1) circ(px, py, 0.04, '#c4a670');
  }
  // the stream, with reeds and ripples, and the wooden bridge where the track crosses it
  rect(0, STREAM.y - 0.08, W, STREAM.h + 0.16, '#7d9a55');
  rect(0, STREAM.y, W, STREAM.h, '#5fa8d8');
  for (let x = 0.4; x < W; x += 1.3) {
    const ph = (T * 0.6 + x * 0.37) % 1;
    line(x + ph * 0.6, STREAM.y + 0.35 + (x % 2.6 < 1.3 ? 0.25 : 0), x + ph * 0.6 + 0.3, STREAM.y + 0.35 + (x % 2.6 < 1.3 ? 0.25 : 0), 'rgba(255,255,255,.5)', 0.04);
    if (hash(x * 10, 7) < 0.3 && (x < STREAM.bridge[0] - 1 || x > STREAM.bridge[1] + 1)) for (const dx of [0, 0.1, 0.2]) line(x + dx, STREAM.y + 0.05, x + dx + 0.03, STREAM.y - 0.35, '#5f8f3a', 0.04);
  }
  const [b0, b1] = STREAM.bridge;
  rect(b0, STREAM.y - 0.3, b1 - b0, STREAM.h + 0.6, '#b07c45');
  for (let y = STREAM.y - 0.25; y < STREAM.y + STREAM.h + 0.3; y += 0.2) line(b0, y, b1, y, 'rgba(90,50,20,.35)', 0.03);
  rect(b0 - 0.05, STREAM.y - 0.35, 0.14, STREAM.h + 0.7, '#6f4826'); rect(b1 - 0.09, STREAM.y - 0.35, 0.14, STREAM.h + 0.7, '#6f4826');
  for (const p of [SHOP_PAD, SHED_PAD]) rrect(p.x, p.y, p.w, p.h - 0.05, 0.12, '#cdc8bc', '#a8a294');
  ell(28.2, 30.2, 0.4, 0.15, 'rgba(60,60,60,.18)');
  rect(0, 31, W, 2.2, '#77756f');
  rect(0, 30.92, W, 0.14, '#d8d3c6'); rect(0, 33.14, W, 0.12, '#d8d3c6');
  for (let x = 0.3; x < W; x += 1.6) rect(x, 32.06, 0.8, 0.08, '#f0ece0');
  for (let x = 0.5; x < W; x += 1.1) ell(x, 34.35, 0.75, 0.5, x % 2.2 < 1.1 ? '#4f8a3a' : '#5a9842', OUT);

    if (SPECIES[sp].pond) {

  for (const k in PENS) for (const it of state.pens[k].items) {

// Each crop stage is drawn once into a small picture at the screen's resolution (again when the zoom changes):

const cropPics = { px: 0, map: new Map() };
function cropPic(k, st) {
  const px = S * DPR;
  if (cropPics.px !== px) { cropPics.px = px; cropPics.map.clear(); }
  let c = cropPics.map.get(k + st);
  if (!c) {

function drawCrop(k, tx, ty, v) {

// Runtime (not saved)

const cam = { x: 23, y: 12 };
const anim = { moving: false, phase: 0 };
let T = 0, hoverId = null, pendingCoins = 0;

let carT = 3, jarT = 0, milkT = 0, fruitT = 0, eggT = 0, fullWarnT = 0, tractorOnShedPad = false;

function burst(x, y, c, n, up = 2) {

// flyers move an icon between two screen points (functions, so they follow the camera)
function toScreen(x, y) { return [(x - cam.x) * S + VW / 2, (y - cam.y) * S + VH / 2]; }
const worldPt = (x, y) => () => toScreen(x, y);
const entPt = (e, dy) => () => toScreen(e.x, e.y + dy);
const playerPt = () => { const p = state.player; return toScreen(p.x, p.y - 0.6); };
const elPt = el => () => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// ======================================================================
// Update
// ======================================================================
function update(dt) {
  T += dt;
  updatePlayer(dt);
  updateHarvest(dt);
  updateCrops(dt);
  for (const k in PENS) updatePen(k, dt);
  updateOrchard(dt);
  updatePickups(dt);
  updateDog(dt);
  updateShop(dt);
  updateCars(dt);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of flyers) f.t += dt;
  for (const f of flyers) if (f.t >= f.dur && f.done) f.done();
  flyers = flyers.filter(f => f.t < f.dur);
  const p = state.player;
  const tx = clamp(p.x, 0, W), ty = clamp(p.y - 0.5, Y0, H);
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  clampCam();
  if (menu.open && menuSig() !== menu.sig) renderMenu();
  updateHUD();
}
function clampCam() {
  const vw = VW / S, vh = VH / S;
  cam.x = vw >= W ? W / 2 : clamp(cam.x, vw / 2, W - vw / 2);
  cam.y = vh >= H - Y0 ? (Y0 + H) / 2 : clamp(cam.y, Y0 + vh / 2, H - vh / 2);
}

const keys = {};
function updatePlayer(dt) {
  const p = state.player;
  let ix = 0, iy = 0;
  if (!menu.open) { ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0); }
  let dir = p.dir;
  if (ix && !iy) dir = ix > 0 ? 'right' : 'left';
  else if (iy && !ix) dir = iy > 0 ? 'down' : 'up';
  else if (ix && iy) { const h = ix > 0 ? 'right' : 'left', v = iy > 0 ? 'down' : 'up'; if (dir !== h && dir !== v) dir = h; }

  const speed = mode === 'tractor' ? CONFIG.tractor.speed[state.tractor.lv.speed - 1] : mount ? SPECIES[state.pens[mount.k].species].ride : CONFIG.walkSpeed;
  const ent = mode === 'tractor' ? state.tractor : p;
  if (moving) {
    const len = Math.hypot(ix, iy);
    moveEnt(ent, ix / len * speed * dt, iy / len * speed * dt, ...BOX[mode], mode);
  }
  p.dir = dir;
  if (mode === 'tractor') { state.tractor.dir = dir; p.x = ent.x; p.y = ent.y; }
  if (mount) { mount.a.x = p.x; mount.a.y = p.y; if (ix) mount.a.face = ix > 0 ? 1 : -1; }
  anim.moving = moving;
  if (moving) anim.phase += dt * (mode === 'horse' ? 10 : 8);
}

function nearestMount() {
  const p = state.player, t = state.tractor;
  if (p.mode !== 'walk') return null;
  let best = null, bd = 1e9;
  const d0 = Math.hypot(Math.max(0, Math.abs(p.x - t.x) - 0.6), Math.max(0, Math.abs(p.y - t.y) - 0.4));
  if (d0 < 0.8) { best = { type: 'tractor', e: t }; bd = d0; }
  for (const k in PENS) {
    const sp = state.pens[k].species;
    if (!sp || !SPECIES[sp].ride) continue;
    for (const a of state.pens[k].animals) {
      if (!a.adult || a.ridden) continue;
      const d = Math.hypot(a.x - p.x, (a.y - p.y) * 1.5) - 0.35;
      if (d < 0.8 && d < bd) { best = { type: 'horse', e: a }; bd = d; }
    }
  }
  return best;
}

function toggleMount() {
  const p = state.player;
  if (p.mode === 'walk') {
    const m = nearestMount();
    if (!m) return;
    if (m.type === 'tractor') { p.mode = 'tractor'; p.x = m.e.x; p.y = m.e.y; p.dir = m.e.dir; sfx('engine'); }
    else { p.mode = 'horse'; p.mount = m.e.id; m.e.ridden = true; p.x = m.e.x; p.y = m.e.y; sfx('neigh'); unstick(p, ...BOX.horse, 'horse'); }
    return;
  }
  const ridden = p.mode === 'horse' ? findMount(p.mount) : null, horse = ridden && ridden.a;
  const from = p.mode === 'tractor' ? state.tractor : p;
  const offs = p.mode === 'tractor'
    ? [[0, 0.7], [-1.0, 0], [1.0, 0], [0, -0.7], [0, 1.1], [-1.3, 0.4], [1.3, 0.4], [-1.3, -0.4], [1.3, -0.4]]
    : [[0, 0.45], [-0.65, 0], [0.65, 0], [0, -0.45], [0, 0.8], [-0.9, 0.3], [0.9, 0.3]];
  const fx0 = from.x, fy0 = from.y;
  let placed = false;
  for (const [ox, oy] of offs) {
    if (!blockedAt(fx0 + ox, fy0 + oy, ...BOX.walk, 'walk')) { p.x = fx0 + ox; p.y = fy0 + oy; placed = true; break; }
  }
  if (!placed) { p.x = fx0; p.y = fy0; unstick(p, ...BOX.walk, 'walk'); }
  if (horse) { horse.ridden = false; horse.x = fx0; horse.y = fy0; horse.wait = rand(1, 3); horse.tx = fx0; horse.ty = fy0; horse.dir = p.dir; horse.walk = false; }
  p.mode = 'walk'; p.mount = null;
  p.dir = 'down';
}

function updateHarvest(dt) {
  fullWarnT -= dt;
  if (state.player.mode !== 'tractor') return;
  const t = state.tractor, cap = tractorCap(), yld = CONFIG.tractor.yield[t.lv.yield - 1];
  for (let tx = Math.floor(t.x - 0.3); tx <= Math.floor(t.x + 0.3); tx++) {
    for (let ty = Math.floor(t.y - 0.3); ty <= Math.floor(t.y + 0.3); ty++) {
      const k = patchAt(tx, ty);
      if (!k) continue;
      const tiles = state.patches[k].tiles, key = tx + ',' + ty, crop = state.patches[k].crops[key];
      if (!(tiles[key] >= 1)) continue;
      const load = loadTotal();
      if (load >= cap) { if (fullWarnT <= 0) { sfx('full'); fullWarnT = 2.5; } continue; }
      tiles[key] = -1;
      t.load[crop] += Math.min(yld * CONFIG.crops[crop].perTile, cap - load);
      burst(tx + 0.5, ty + 0.4, CROP_COLOR[crop], 5);
      burst(tx + 0.5, ty + 0.4, '#6fb04a', 3);
      sfx('cut', 40);
      if (loadTotal() >= cap) { sfx('full'); fullWarnT = 2.5; }
    }
  }
}

function updateCrops(dt) {
  for (const k in PATCHES) {
    const { tiles, crops } = state.patches[k];
    for (const key in tiles) { const v = tiles[key]; if (v >= 0 && v < 1) tiles[key] = Math.min(1, v + dt / CONFIG.crops[crops[key]].grow); }
  }
}

function makeAnimal(sp, sex, adult, x, y) {
  const pe = CONFIG.animals[sp].produceEvery;
  return { id: state.nextId++, sex, adult, age: 0, x, y, tx: x, ty: y, wait: rand(0.3, 1.5), face: Math.random() < 0.5 ? -1 : 1,
    prodT: pe ? rand(pe[0], pe[1]) : 0, milk: 0, wool: rand(0, 0.5), inside: 0 };
}
function pickTarget(k, a) {
  const r = penInterior(k), open = PENS[k].open, coop = isBirdPen(k) && coopRect(k);
  for (let i = 0; i < 8; i++) {
    const x = rand(r.x0, r.x1), y = rand(r.y0, r.y1);
    if (coop && x > coop.x - 0.3 && x < coop.x + coop.w + 0.3 && y < coop.y + coop.h + 0.3) continue;
    if (open && TREES.some(t => Math.hypot(t.x - x, t.y - y) < 0.8)) continue;
    a.tx = x; a.ty = y; return;
  }
  a.tx = a.x; a.ty = a.y;
}
// birds walk to the coop door, pop inside for a few seconds and come back out (laying an egg if they went to lay)
function goToCoop(k, a) { const d = coopDoor(k); a.toCoop = true; a.tx = d.x + rand(-0.1, 0.1); a.ty = d.y; a.wait = 0; }

function updatePen(k, dt) {
  const pen = state.pens[k], A = pen.animals, sp = pen.species, open = PENS[k].open;
  if (!sp || !A.length || !owned(k)) return;
  const cfg = CONFIG.animals[sp], kind = SPECIES[sp];
  if (!open) {
    const drain = (CONFIG.trough.drainBase + CONFIG.trough.drainPerAnimal * A.length) * dt;
    pen.food = Math.max(0, pen.food - drain);
    pen.water = Math.max(0, pen.water - drain);
  }
  const ok = open || (pen.food > 0 && pen.water > 0), r = penRect(k), ir = penInterior(k);
  for (const a of A) {
    if (a.ridden) continue;
    a.age += dt;
    if (!a.adult && a.age >= cfg.growUp) { a.adult = true; burst(a.x, a.y - 0.4, '#fff3a0', 8); sfx('pop'); }
    if (a.inside > 0) {
      a.inside -= dt;
      if (a.inside <= 0) {
        const d = coopDoor(k);
        a.x = d.x + rand(-0.2, 0.2); a.y = d.y + 0.2; a.wait = rand(0.5, 1.5); pickTarget(k, a);
        if (a.laying) { a.laying = false; pen.eggs = Math.min(eggLimit(k), pen.eggs + 1); }
      }
      continue;
    }
    const inPen = inRect(a.x, a.y, r);
    if (inPen) {
      a.x = clamp(a.x, ir.x0, ir.x1); a.y = clamp(a.y, ir.y0, ir.y1);
      a.wait -= dt;
      a.walk = false;
      if (a.wait <= 0) {
        const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
        if (d < 0.05) {
          if (a.toCoop) { a.toCoop = false; a.inside = rand(3, 5); continue; }
          a.wait = rand(1, 4); a.grazing = Math.random() < 0.6; pickTarget(k, a);
          if (kind.bird && Math.random() < 0.08) goToCoop(k, a);
        } else {
          const st = Math.min(d, kind.speed * (a.adult ? 1 : 1.2) * dt);
          a.x += dx / d * st; a.y += dy / d * st;
          if (Math.abs(dx) > 0.02) a.face = dx > 0 ? 1 : -1;
          a.walk = true; a.phase = (a.phase || 0) + dt * (kind.bird ? 9 : 5);
          a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        }
      }
    }
    a.graze = clamp((a.graze || 0) + (a.grazing && !a.walk && a.wait > 0.4 ? 2.5 : -2.5) * dt, 0, 1);
    if (!ok || !a.adult || !cfg.produceEvery) continue;
    if (kind.product === 'wool') { a.wool = Math.min(1, (a.wool || 0) + dt * 2 / (cfg.produceEvery[0] + cfg.produceEvery[1])); continue; }
    if (kind.product !== 'manure' && a.sex !== 'f') continue;
    // limits: production waits while enough is already lying around
    if (kind.product === 'egg' && (a.laying || pen.eggs + A.filter(b => b.laying).length >= eggLimit(k))) continue;
    if (kind.product === 'milk' && a.milk >= CONFIG.limits.milk) continue;
    if (kind.product === 'manure' && pen.items.length >= CONFIG.limits.manure) continue;
    a.prodT -= dt;
    if (a.prodT > 0) continue;
    a.prodT = rand(cfg.produceEvery[0], cfg.produceEvery[1]);
    if (kind.product === 'egg') { a.laying = true; goToCoop(k, a); }
    else if (kind.product === 'milk') a.milk++;
    else if (inPen) pen.items.push({ id: state.nextId++, kind: 'manure', x: a.x + rand(-0.15, 0.15), y: a.y + rand(0, 0.1) });
  }
  const adults = A.filter(a => a.adult && !a.ridden);
  if (ok && adults.some(a => a.sex === 'f') && adults.some(a => a.sex === 'm') && A.length < penCap(k)) {
    pen.breedT += dt;
    if (pen.breedT >= cfg.breedEvery) {
      pen.breedT = 0;
      const moms = adults.filter(a => a.sex === 'f' && !(a.inside > 0) && inRect(a.x, a.y, r));
      if (moms.length) {
        const mom = moms[Math.floor(Math.random() * moms.length)];
        const baby = makeAnimal(sp, Math.random() < 0.5 ? 'f' : 'm', false, clamp(mom.x + rand(-0.3, 0.3), ir.x0, ir.x1), clamp(mom.y + 0.15, ir.y0, ir.y1));
        A.push(baby);
        burst(baby.x, baby.y - 0.3, '#ff8fb0', 10);
        sfx('baby');
      }
    }
  }
}

// Everything the farmer picks up goes in the basket, up to basketCap().
function takeIntoBasket(kind, from) {
  if (basketRoom() <= 0) { basketFull(); return false; }
  state.player.carry[kind]++;
  fly(kind, from, playerPt, 0.35, () => sfx('pop'), 0, 0.3);
  if (basketRoom() <= 0) basketFull();
  return true;
}
function basketFull() { if (fullWarnT <= 0) { sfx('full'); fullWarnT = 2.5; } }

function updatePickups(dt) {
  const p = state.player;
  if (p.mode === 'tractor') return;
  milkT -= dt; eggT -= dt;
  for (const k in PENS) {
    const pen = state.pens[k], sp = pen.species;
    if (!sp || !owned(k)) continue;
    const product = SPECIES[sp].product;
    for (let i = pen.items.length - 1; i >= 0; i--) {
      const it = pen.items[i];
      if (Math.hypot(it.x - p.x, it.y - p.y) > 1.0) continue;
      if (!takeIntoBasket(it.kind, worldPt(it.x, it.y - 0.1))) break;
      pen.items.splice(i, 1);
    }
    if (product === 'wool') for (const a of pen.animals) {
      if (a.wool < 1 || a.ridden || Math.hypot(a.x - p.x, a.y - p.y) > 1.0) continue;
      if (!takeIntoBasket('wool', worldPt(a.x, a.y - 0.4))) break;
      a.wool = 0;
      burst(a.x, a.y - 0.4, sp === 'alpaca' && a.sex === 'm' ? '#c9a27a' : '#fbf8f0', 8);
    }
    if (product === 'milk' && milkT <= 0 && inRect(p.x, p.y, penRect(k))) {
      const a = pen.animals.find(b => b.milk > 0);
      if (a && takeIntoBasket('milk', worldPt(a.x + a.face * 0.3, a.y - 0.35))) { a.milk--; milkT = 0.3; }
    }
    if (product === 'egg' && pen.eggs > 0 && eggT <= 0) {
      const n = nestPos(k);
      if (Math.hypot(n.x - p.x, n.y - p.y) < 1.2 && takeIntoBasket('egg', worldPt(n.x, n.y - 0.2))) { pen.eggs--; eggT = 0.15; }
    }
  }
  fruitT -= dt;
  if (fruitT <= 0) {
    SPOTS.forEach((sp, i) => {
      const o = state.orchard[i];
      if (!o.kind || o.fruit <= 0 || fruitT > 0 || Math.hypot(sp.x - p.x, (sp.y - p.y) * 1.3) > 1.4) return;
      if (takeIntoBasket(o.kind, worldPt(sp.x, sp.y - 1.15))) o.fruit--;
      fruitT = 0.15;
    });
  }
}

// The dog lives by the house. It notices the farmer on foot when he comes within 3 tiles and then
// follows him around the house until he gets 8 tiles ahead; the tractor or a horse leaves it behind.
// It never enters a pen, and otherwise potters about and sits.
function updateDog(dt) {
  const d = state.dog, p = state.player, dist = Math.hypot(p.x - d.x, p.y - d.y);
  dogAnim.waitT -= dt;
  if (p.mode !== 'walk' || dist > 8 || Math.hypot(p.x - DOGHOUSE.x, p.y - DOGHOUSE.y) > 14) d.following = false;
  else if (dist < 3) d.following = true;
  const follow = d.following && dogAnim.waitT <= 0;
  if (follow && dist < 1.5) {   // sitting by the farmer, looking at him
    const fx = p.x - d.x, fy = p.y - d.y;
    d.dir = Math.abs(fx) > Math.abs(fy) ? (fx > 0 ? 'right' : 'left') : (fy > 0 ? 'down' : 'up');
  }
  if (follow) {
    d.tx = p.x + (d.x - p.x) / (dist || 1) * 1.1; d.ty = p.y + (d.y - p.y) / (dist || 1) * 0.8;
    d.speed = clamp(dist * 1.4, 1.2, 3.6); d.waitT = rand(2, 5);
  } else {
    d.waitT -= dt;
    if (d.waitT <= 0) {
      d.waitT = rand(5, 12);
      if (Math.random() < 0.6 || !inRect(d.x, d.y, DOG_HOME)) {
        d.tx = rand(DOG_HOME.x, DOG_HOME.x + DOG_HOME.w); d.ty = rand(DOG_HOME.y, DOG_HOME.y + DOG_HOME.h); d.speed = 1.3;
      }
    }
  }
  const dx = d.tx - d.x, dy = d.ty - d.y, len = Math.hypot(dx, dy);
  dogAnim.moving = len > 0.08 && !(follow && dist < 1.5);
  if (!dogAnim.moving) return;
  const step = Math.min(len, d.speed * dt), x0 = d.x, y0 = d.y;
  moveEnt(d, dx / len * step, dy / len * step, ...BOX.dog, 'dog');
  dogAnim.stuckT = Math.hypot(d.x - x0, d.y - y0) < step * 0.3 ? dogAnim.stuckT + dt : 0;
  if (dogAnim.stuckT > 1.2) {   // a fence in the way: sit and wait a moment
    d.tx = d.x; d.ty = d.y; dogAnim.stuckT = 0; dogAnim.waitT = 3; dogAnim.moving = false; return;
  }
  d.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  dogAnim.phase += dt * (2 + d.speed * 2.2);
}

function updateOrchard(dt) {
  SPOTS.forEach((sp, i) => {
    const o = state.orchard[i];
    if (!o.kind) return;
    const cfg = CONFIG.trees[o.kind], wasYoung = o.age < cfg.grow;
    o.age += dt;
    if (o.age < cfg.grow) return;
    if (wasYoung) { burst(sp.x, sp.y - 1.1, '#fff3a0', 12, 2.5); sfx('pop'); }
    o.t += dt;
    if (o.t >= cfg.every) { o.t = 0; o.fruit = Math.min(CONFIG.maxFruitPerTree, o.fruit + 1); }
  });
}

function updateShop(dt) {
  const p = state.player, t = state.tractor;
  const onShed = inRect(t.x, t.y, SHED_PAD, 0.1);
  if (onShed && !tractorOnShedPad && p.mode === 'tractor' && !menu.open) openMenu('repair');
  tractorOnShedPad = onShed;
  const ent = p.mode === 'tractor' ? t : p;
  if (!inRect(ent.x, ent.y, SHOP_PAD, 0.2)) return;
  unload(p.mode === 'tractor' ? t.load : p.carry, ent, p.mode === 'tractor' ? -1.0 : -0.6);
  jarT -= dt;
  const jar = state.shop.jar;
  if (jar > 0 && jarT <= 0) {
    const take = Math.min(jar, Math.max(1, Math.ceil(jar / 15)));
    state.shop.jar -= take; state.coins += take; pendingCoins += take;
    fly('coin', worldPt(JAR.x, JAR.y - 0.9), elPt(coinIcon), 0.55, () => { pendingCoins -= take; bumpCoins(); sfx('coin', 50); });
    jarT = 0.09;
  }
}

function unload(src, ent, dy) {
  let n = 0;
  for (const kind in src) {
    const c = src[kind];
    if (!c) continue;
    state.shop.stock[kind] += c;
    src[kind] = 0;
    const sp = slotPos(kind);
    for (let j = 0; j < Math.min(c, 6); j++) fly(kind, entPt(ent, dy), worldPt(sp.x, sp.y - 0.3), 0.5, null, j * 0.07 + n * 0.1, 0.34);
    n++;
  }
  if (n) { sfx('drop'); carT = Math.min(carT, 0.8); }
}

const carY = c => c.lane ? 32.95 : 31.85;
const CAR_COLORS = ['#3d7cc9', '#e2a21a', '#6ab04c', '#9b59b6', '#e05a4a', '#2fa3a0', '#f0f0ea'];
function updateCars(dt) {
  carT -= dt;
  if (carT <= 0) {
    const bundles = Math.floor(stockTotal() / CONFIG.itemsPerCoin), stopper = cars.some(c => c.stop && c.state !== 'out');
    const color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
    if (bundles > 0 && !stopper) {
      cars.push({ x: -2, lane: 0, dir: 1, v: 7, color, stop: true, state: 'in', timer: 0, bought: false });
      carT = clamp(CONFIG.cars.maxGap - bundles * 1.5, CONFIG.cars.minGap, CONFIG.cars.maxGap) + rand(0, 1.5);
    } else {
      const lane = stopper || Math.random() < 0.5 ? 1 : 0;
      cars.push({ x: lane ? W + 3 : -3, lane, dir: lane ? -1 : 1, v: 4.5, color, stop: false, state: 'out', timer: 0 });
      carT = bundles > 0 ? rand(2, 4) : rand(9, 18);
    }
  }
  for (const c of cars) {
    if (c.state === 'in') {
      const d = STOP_X - c.x;
      c.v = clamp(d * 2.2, 0.5, 7);
      c.x += c.v * dt;
      if (d < 0.03) { c.x = STOP_X; c.state = 'wait'; c.timer = 0.5; sfx('horn', 400); }
    } else if (c.state === 'wait') {
      c.timer -= dt;
      if (c.timer <= 0) {
        if (!c.bought) { c.bought = true; c.timer = carBuys(c) * 0.12 + 1.2; }
        else c.state = 'out';
      }
    } else {
      c.v = Math.min(4.5, c.v + dt * 3);
      c.x += c.v * c.dir * dt;
    }
  }
  cars = cars.filter(c => c.x > -4 && c.x < W + 4);
}

function carBuys(car) {
  const stock = state.shop.stock, per = CONFIG.itemsPerCoin;
  const bundles = Math.min(Math.floor(stockTotal() / per), 1 + Math.floor(Math.random() * 2) + Math.floor(stockTotal() / 40));
  let n = 0;
  for (let b = 0; b < bundles; b++) {
    for (let i = 0; i < per; i++, n++) {
      let r = Math.random() * stockTotal(), kind = null;
      for (const k of STOCK_KINDS) { r -= stock[k]; if (r < 0) { kind = k; break; } }
      if (!kind) kind = STOCK_KINDS.find(k => stock[k] > 0);
      stock[kind]--;
      const payNow = i === per - 1 ? () => fly('coin', worldPt(car.x, 31.3), worldPt(JAR.x, JAR.y - 0.85), 0.45, () => { state.shop.jar += 1; sfx('clink', 40); }, 0, 0.36) : null;
      const from = slotPos(kind);
      fly(kind, worldPt(from.x, from.y - 0.3), () => toScreen(car.x, 31.4), 0.4, payNow, n * 0.12, 0.32);
    }
  }
  return n;
}

// ======================================================================
// Draw
// ======================================================================
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const fxCv = document.getElementById('fx'), fx = fxCv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, S = 64;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  for (const c of [cv, fxCv]) { c.width = Math.round(VW * DPR); c.height = Math.round(VH * DPR); }
  S = Math.max(36, Math.min(VW / 20, VH / 12));
}

function draw() {
  g = ctx;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (VW / 2 - cam.x * S), DPR * (VH / 2 - cam.y * S));
  const v = { x0: cam.x - VW / 2 / S - 1, y0: cam.y - VH / 2 / S - 1, x1: cam.x + VW / 2 / S + 1, y1: cam.y + VH / 2 / S + 2 };
  drawGround(v);
  drawPatches(v);
  const list = [];
  collectSorted(list, v);
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.f();
  for (const p of particles) { g.globalAlpha = clamp(p.life / 0.4, 0, 1); circ(p.x, p.y, p.s, p.c); }
  g.globalAlpha = 1;
  drawWorldOverlays();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScreenOverlays();
  g = fx;
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, fxCv.width, fxCv.height);
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const f of flyers) {
    if (f.t < 0) continue;
    const q = clamp(f.t / f.dur, 0, 1), e = q * q * (3 - 2 * q), a = f.from(), b = f.to();
    drawIcon(f.k, a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(q * Math.PI) * 50, S * f.size);
  }
}

function collectSorted(list, v) {
  const add = (y, f) => list.push({ y, f });
  const seen = (x, y) => x > v.x0 - 1.5 && x < v.x1 + 1.5 && y > v.y0 && y < v.y1 + 2;   // trees and animals off screen are skipped
  add(HOUSE.y + HOUSE.h, drawHouse);
  add(SHOP.y + SHOP.h + 0.1, drawShop);
  add(SHED.y + SHED.h, drawShed);
  add(DOGHOUSE.y, drawDogHouse);
  add(state.dog.y + 0.12, drawDog);
  for (const t of TREES) if (seen(t.x, t.y)) add(t.y, () => drawTree(t));
  for (const b of BUSHES) if (seen(b.x, b.y)) add(b.y, () => drawBush(b));
  const plotWiggle = state.coins >= plotPrice();
  for (const k in PENS) {
    const d = PENS[k], r = penRect(k), x1 = r.x + r.w, y1 = r.y + r.h, sp = state.pens[k].species;
    if (!owned(k)) { add(d.sign.y, () => drawSign(d.sign, 'plotPen', 'pen-' + k, plotWiggle)); continue; }
    for (const a of state.pens[k].animals) if (!a.ridden && !(a.inside > 0) && seen(a.x, a.y)) add(a.y, () => drawAnimal(k, a));
    add(d.sign.y, () => drawSign(d.sign, sp ? sp + '-f' : 'gate', 'pen-' + k, false));
    if (d.open) continue;
    add(r.y, () => fenceH(r.x, x1, r.y));
    for (let y = r.y; y < y1; y++) add(y + 1, () => { fenceV(r.x, y, y + 1); fenceV(x1, y, y + 1); });
    add(y1 + 0.01, () => { fenceH(r.x, d.gate[0], y1); fenceH(d.gate[1], x1, y1); post(d.gate[0], y1, true); post(d.gate[1], y1, true); });
    if (isBirdPen(k)) { const c = coopRect(k); add(c.y + c.h, () => drawCoop(c, k)); }
    add(d.troughs.y + 0.42, () => drawTroughs(k));
  }
  for (const k in PATCHES) {
    if (!owned(k)) { add(PATCHES[k].sign.y, () => drawSign(PATCHES[k].sign, 'plotField', 'crop-' + k, plotWiggle)); continue; }
    const wiggle = bareTiles(k) === Object.keys(state.patches[k].tiles).length && state.coins >= sowCost(k, CROPS[0]);
    add(PATCHES[k].sign.y, () => drawSign(PATCHES[k].sign, fieldIcon(k), 'crop-' + k, wiggle));
  }
  SPOTS.forEach((sp, i) => add(sp.y, () => drawSpot(i)));
  const p = state.player, t = state.tractor;
  add(t.y + 0.45, () => drawTractor(t));
  if (p.mode === 'walk') add(p.y + 0.14, () => drawFarmer(p.x, p.y + 0.14, p.dir, anim.phase, anim.moving, p.carry));
  const m = p.mode === 'horse' && findMount(p.mount);
  if (m) {
    const sp = state.pens[m.k].species;
    add(p.y + 0.22, () => {
      const y = p.y + 0.22 - (anim.moving ? Math.abs(Math.sin(anim.phase)) * 0.05 : 0), dir = p.dir;
      if (sp === 'horse' && art(m.a.sex === 'm' ? 'horse_m' : 'horse_f', 'left')) {
        const frame = anim.moving ? Math.floor(anim.phase * 0.6) : 0, side = dir === 'left' || dir === 'right';
        if (!side) drawRider(p.x, y, 1, HORSE_SEAT[dir], dir);
        drawHorseSprite(p.x, y, m.a.sex, false, dir, frame);
        if (side) drawRider(p.x + (dir === 'left' ? 0.12 : -0.12), y, dir === 'left' ? -1 : 1, HORSE_SEAT[dir], dir);
        return;
      }
      drawSpecies(sp, p.x, y, m.a.face, m.a.sex, false, { id: m.a.id, walk: anim.moving, phase: anim.phase * 0.8 });
      drawRider(p.x, y, m.a.face, SEAT[sp]);
    });
  }
  for (const c of cars) add(carY(c), () => drawCar(c));
}

function drawWorldOverlays() {
  // empty trough bubbles
  for (const k in PENS) {
    const pen = state.pens[k], d = PENS[k].troughs;
    if (!d || !owned(k) || !pen.animals.length) continue;
    const pulse = 1 + Math.sin(T * 6) * 0.08;
    if (pen.food <= 0) { circ(d.x + 0.45, d.y - 0.5, 0.32 * pulse, '#fff', OUT); drawIcon('food', d.x + 0.45, d.y - 0.5, 0.42 * pulse); }
    if (pen.water <= 0) { circ(d.x + 1.4, d.y - 0.5, 0.32 * pulse, '#fff', OUT); drawIcon('water', d.x + 1.4, d.y - 0.5, 0.42 * pulse); }
  }
  // eggs waiting in a nest basket: a bobbing egg over the coop
  for (const k in PENS) {
    if (!owned(k) || !isBirdPen(k) || !state.pens[k].eggs) continue;
    const c = coopRect(k), bx = c.x + c.w / 2, by = c.y - 0.75 + Math.sin(T * 3) * 0.08;
    circ(bx, by, 0.34, '#fff', OUT); drawIcon('egg', bx, by, 0.42);
  }
  // tractor load bar
  const t = state.tractor, load = loadTotal(), cap = tractorCap();
  if (state.player.mode === 'tractor' || load > 0) {
    const y = tractorTop(t) - 0.25, full = load >= cap;
    rrect(t.x - 0.6, y, 1.2, 0.2, 0.1, '#fff', '#4a3010');
    if (load) rrect(t.x - 0.57, y + 0.03, 1.14 * load / cap, 0.14, 0.07, full ? (Math.sin(T * 10) > 0 ? '#e2533d' : '#f08a5d') : '#6ab04c');
    if (full) { const b = Math.abs(Math.sin(T * 5)) * 0.18; drawIcon('storage', t.x, y - 0.4 - b, 0.6); }
  }
  // full basket
  const p = state.player;
  if (p.mode !== 'tractor' && basketRoom() <= 0) {
    const b = Math.abs(Math.sin(T * 5)) * 0.18;
    drawIcon('basket', p.x, p.y - (p.mode === 'horse' ? 2.1 : 1.45) - b, 0.7);
  }
}

function drawScreenOverlays() {
  const jar = state.shop.jar;
  if (jar > 0) {
    const [sx, sy] = toScreen(JAR.x, JAR.y - 1.55);
    numberBadge(sx, sy, jar);
  }
  for (const kind of STOCK_KINDS) {
    const n = state.shop.stock[kind];

  }
  // how many eggs wait in each nest basket
  for (const k in PENS) {
    if (!owned(k) || !isBirdPen(k) || !state.pens[k].eggs) continue;

  if (DEV) { g.font = '12px monospace'; g.fillStyle = '#fff'; g.fillText(`${state.player.x.toFixed(1)}, ${state.player.y.toFixed(1)}  fps ${fpsShown}`, 8, VH - 8); }
}
function numberBadge(x, y, n) {
  const s = String(n), w = Math.max(34, 16 + s.length * 16);
  g.beginPath(); g.roundRect(x - w / 2, y - 17, w, 34, 17); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#a86e10'; g.stroke();
  g.font = 'bold 24px "Trebuchet MS", Verdana, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#5a3a05';
  g.fillText(s, x, y + 1);
}
function smallBadge(x, y, n) {
  const s = String(n);
  g.font = 'bold 14px "Trebuchet MS", Verdana, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 3; g.strokeStyle = '#4a3010'; g.strokeText(s, x, y); g.fillStyle = '#fff'; g.fillText(s, x, y);
}
function keyHint(x, y) {
  g.beginPath(); g.roundRect(x - 26, y - 22, 52, 40, 9); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#4a3010'; g.stroke();
  g.beginPath(); g.moveTo(x + 12, y - 12); g.lineTo(x + 12, y + 4); g.lineTo(x - 12, y + 4);
  g.strokeStyle = '#4a3010'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
  g.beginPath(); g.moveTo(x - 4, y - 3); g.lineTo(x - 13, y + 4); g.lineTo(x - 4, y + 11); g.stroke();
}

const coinBox = document.getElementById('coinbox'), coinNum = document.getElementById('coinNum'), carryEl = document.getElementById('carry');
const coinIcon = document.getElementById('coinIcon');
let lastBump = 0, coinShown = null, carrySig = '';
function bumpCoins() {
  const now = performance.now();
  if (now - lastBump < 180) return;
  lastBump = now;
  coinBox.classList.remove('bump'); void coinBox.offsetWidth; coinBox.classList.add('bump');
}
function updateHUD() {
  enterBtn.classList.toggle('idle', state.player.mode === 'walk' && !nearestMount());
  const shown = state.coins - pendingCoins;
  if (shown !== coinShown) { coinNum.textContent = shown; coinShown = shown; }
  const p = state.player, t = state.tractor, load = loadTotal(), cap = tractorCap();
  const sig = p.mode === 'tractor' ? `t|${load}|${cap}` : 'w|' + basketCap() + '|' + CARRY_KINDS.map(k => p.carry[k]).join('|');
  if (sig === carrySig) return;
  carrySig = sig;
  carryEl.innerHTML = '';
  const meter = (icon, n, max) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (n >= max ? ' full' : '');
    pill.append(iconCanvas(icon, 44));
    const bar = document.createElement('div'); bar.className = 'bar';
    const fill = document.createElement('div'); fill.style.width = (100 * n / max) + '%';
    bar.append(fill); pill.append(bar);
    const num = document.createElement('span'); num.textContent = n + '/' + max; pill.append(num);
    carryEl.append(pill);
  };
  if (p.mode === 'tractor') meter('tractor', load, cap);
  else {
    meter('basket', carryTotal(), basketCap());
    for (const k of CARRY_KINDS) {
      if (!p.carry[k]) continue;
      const pill = document.createElement('div'); pill.className = 'pill';
      pill.append(iconCanvas(k, 44));
      const num = document.createElement('span'); num.textContent = p.carry[k]; pill.append(num);
      carryEl.append(pill);
    }
  }
}

// ======================================================================
// Menus (signs, troughs, repair shed). No words: pictures, numbers, coins.
// ======================================================================
const menuBack = document.getElementById('menuBack'), menuEl = document.getElementById('menu');
const menu = { open: false, type: null, key: null, pending: { f: 0, m: 0 }, choice: null, sig: '' };
menuBack.addEventListener('pointerdown', e => { if (e.target === menuBack) closeMenu(); });

function openMenu(type, key) {
  Object.assign(menu, { open: true, type, key, pending: { f: 0, m: 0 }, choice: null });
  for (const k in keys) keys[k] = false;
  renderMenu();
  menuBack.classList.add('open');
  sfx('click');
}
function closeMenu() { if (!menu.open) return; menu.open = false; menuBack.classList.remove('open'); }

function menuSig() {
  const k = menu.key, parts = [menu.type, k, state.coins, menu.pending.f, menu.pending.m];
  if (menu.type === 'crop') parts.push(state.patches[k].ext, bareTiles(k) > 0);
  if (menu.type === 'pen') parts.push(state.pens[k].species, menu.choice, state.pens[k].ext, state.pens[k].animals.length, state.pens[k].coopLv);
  if (menu.type === 'trough') parts.push(Math.ceil(state.pens[k].food * 20), Math.ceil(state.pens[k].water * 20));
  if (menu.type === 'repair') parts.push(JSON.stringify(state.tractor.lv));
  if (menu.type === 'house') parts.push(state.basketLv);
  if (menu.type === 'tree') parts.push(state.orchard[k].kind);
  return parts.join('|');
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; e.tabIndex = -1; return e; }
function row(...kids) { const r = el('div', 'row'); r.append(...kids); return r; }
function pips(n, total = 5) { const p = el('div', 'pips'); for (let i = 0; i < total; i++) p.append(el('div', 'pip' + (i < n ? ' on' : ''))); return p; }
const maxStar = () => iconCanvas('star', 84, 'star');
function coinBtn(price, enabled, onBuy) {
  const b = el('button', 'coinbtn', price);
  b.disabled = !enabled || state.coins < price;
  b.onclick = () => {
    b.blur();
    if (b.disabled || state.coins < price) return;
    spend(price, b);
    onBuy();
    if (menu.open) renderMenu();
  };
  return b;
}
function spend(price, btn) {
  state.coins -= price;
  const to = elPt(btn), from = elPt(coinIcon);
  const a = from(), b = to();
  for (let i = 0; i < Math.min(price, 6); i++) fly('coin', () => a, () => b, 0.4, null, i * 0.06, 0.4);
  sfx('buy');
}

function renderMenu() {
  menuEl.innerHTML = '';
  const close = el('button', 'close');
  close.onclick = closeMenu;
  menuEl.append(close);
  const k = menu.key;
  // each choice sits in its own card: its picture and its coin together
  const cards = (items, make) => { const c = el('div', 'cards'); for (const it of items) { const card = el('div', 'card'); card.append(...make(it)); c.append(card); } menuEl.append(c); };
  const tool = (icon, act) => { const b = el('button', 'toolbtn'); b.append(iconCanvas(icon, 64)); b.onclick = () => { b.blur(); act(); }; return b; };
  if (menu.type === 'crop') {
    cards(CROPS, crop => [iconCanvas(crop, 84, 'ic'), coinBtn(sowCost(k, crop), bareTiles(k) > 0, () => sow(k, crop))]);
    const ext = state.patches[k].ext;
    menuEl.append(row(iconCanvas('extendCrop', 84, 'ic'), pips(ext),
      ext < 5 ? coinBtn(CONFIG.cropExtendPrice[ext], true, () => extendPatch(k)) : maxStar()));
  } else if (menu.type === 'plot') {
    menuEl.append(row(iconCanvas(PENS[k] ? 'plotPen' : 'plotField', 84, 'ic'), coinBtn(plotPrice(), true, () => buyPlot(k))));
  } else if (menu.type === 'pen') {
    const pen = state.pens[k], sp = pen.species || menu.choice;
    if (!sp) {
      // an empty pen: choose which animal it is for
      const grid = el('div', 'picks');
      for (const c of PEN_CHOICES) {
        const b = el('button', 'pick');
        b.append(iconCanvas(c + '-f', 76));
        b.onclick = () => { b.blur(); menu.choice = c; sfx('click'); renderMenu(); };
        grid.append(b);
      }
      menuEl.append(grid);
    } else {
      const cap = penCap(k, sp), n = pen.animals.length, pend = menu.pending.f + menu.pending.m;
      const slots = el('div', 'slots');
      for (let i = 0; i < cap; i++) slots.append(el('div', 'slot' + (i < n ? ' full' : i < n + pend ? ' new' : '')));
      menuEl.append(slots);
      for (const sex of ['f', 'm']) {
        const price = CONFIG.animals[sp].price[sex], cnt = menu.pending[sex];
        const minus = el('button', 'round minus', '−'), plus = el('button', 'round plus', '+'), num = el('div', 'num', cnt);
        minus.disabled = cnt <= 0;
        plus.disabled = n + pend >= cap;
        minus.onclick = () => { minus.blur(); if (menu.pending[sex] > 0) { menu.pending[sex]--; sfx('click'); renderMenu(); } };
        plus.onclick = () => { plus.blur(); if (n + menu.pending.f + menu.pending.m < cap) { menu.pending[sex]++; sfx('click'); renderMenu(); } };
        menuEl.append(row(iconCanvas(sp + '-' + sex, 84, 'ic'), minus, num, plus, coinBtn(price * cnt, cnt > 0, () => buyAnimals(k, sex, cnt))));
      }
      const ext = pen.ext;
      menuEl.append(row(iconCanvas(PENS[k].open ? 'extendMeadow' : 'extendPen', 84, 'ic'), pips(ext),
        ext < 5 ? coinBtn(CONFIG.penExtendPrice[ext], true, () => extendPen(k)) : maxStar()));
      if (SPECIES[sp].bird) {
        const lv = pen.coopLv;
        menuEl.append(row(iconCanvas('coop', 84, 'ic'), pips(lv, 4),
          lv < 4 ? coinBtn(CONFIG.coop.price[lv - 1], true, () => upgradeCoop(k)) : maxStar()));
      }
      if (n && !PENS[k].open) menuEl.append(row(iconCanvas(sp + '-f', 84, 'ic'), tool('trailer', () => sendAway(k))));
    }
  } else if (menu.type === 'trough') {
    const pen = state.pens[k];
    for (const [what, price, color] of [['food', CONFIG.trough.foodPrice, '#e7c14a'], ['water', CONFIG.trough.waterPrice, '#4aa3df']]) {
      const bar = el('div', 'lvl'), fill = el('div');
      fill.style.width = (100 * pen[what]) + '%'; fill.style.background = color; bar.append(fill);
      menuEl.append(row(iconCanvas(what, 84, 'ic'), bar, coinBtn(price, pen[what] < 0.95, () => { pen[what] = 1; })));
    }
  } else if (menu.type === 'tree') {
    const planted = state.orchard[k].kind;
    if (planted) menuEl.append(row(iconCanvas('tree-' + planted, 84, 'ic'), tool('shovel', () => removeTree(k))));
    else cards(FRUITS, f => [iconCanvas('tree-' + f, 84, 'ic'), coinBtn(CONFIG.trees[f].price, true, () => plantTree(k, f))]);
  } else if (menu.type === 'house') {
    const lv = state.basketLv;
    menuEl.append(row(iconCanvas('basket', 84, 'ic'), pips(lv),
      lv < 5 ? coinBtn(CONFIG.basket.price[lv - 1], true, upgradeBasket) : maxStar()));
  } else if (menu.type === 'reset') {
    // step 1: a big red button; step 2: hold it for 3 seconds while the ring fills
    const btn = el('button', 'bigred');
    btn.innerHTML = SVG_RESET_BIG;
    if (k === 1) { btn.onclick = () => { btn.blur(); menu.key = 2; sfx('click'); renderMenu(); }; menuEl.append(btn); }
    else { const ring = el('div', 'ring'); ring.append(btn); menuEl.append(ring); holdToReset(btn, ring); }
  } else if (menu.type === 'repair') {
    const lv = state.tractor.lv;
    for (const a of ['speed', 'storage', 'yield']) {
      menuEl.append(row(iconCanvas(a, 84, 'ic'), pips(lv[a]),
        lv[a] < 5 ? coinBtn(CONFIG.tractor.price[lv[a] - 1], canUpgrade(a), () => upgrade(a)) : maxStar()));
    }
  }
  menu.sig = menuSig();
}

function canUpgrade(a) {
  const lv = state.tractor.lv;
  if (lv[a] >= 5) return false;
  const after = { ...lv, [a]: lv[a] + 1 };
  return after[a] - Math.min(after.speed, after.storage, after.yield) <= CONFIG.maxUpgradeGap;
}

function sow(k, crop) {
  const { tiles, crops } = state.patches[k];
  state.patches[k].last = crop;
  for (const key in tiles) if (tiles[key] < 0) {
    tiles[key] = 0;
    crops[key] = crop;
    const [x, y] = key.split(',').map(Number);
    burst(x + 0.5, y + 0.5, '#6dbb45', 2, 1);
  }
  closeMenu();
}
function extendPatch(k) {
  const seg = nextPatchSeg(k);
  state.patches[k].ext++;
  eachTile(seg, (x, y) => { state.patches[k].tiles[x + ',' + y] = -1; burst(x + 0.5, y + 0.5, '#fff3a0', 3); });
  closeMenu();
}
function extendPen(k) {
  const seg = nextPenSeg(k);
  state.pens[k].ext++;
  buildObstacles();
  unstickAll();
  eachTile(seg, (x, y) => burst(x + 0.5, y + 0.5, '#fff3a0', 3));
  closeMenu();
}
function buyAnimals(k, sex, n) {
  const pen = state.pens[k];
  if (!pen.species) { pen.species = menu.choice; buildObstacles(); unstickAll(); }
  // new animals arrive at the gate (or near the sign of the open meadow)
  const d = PENS[k], ir = penInterior(k);
  const gx = d.gate ? (d.gate[0] + d.gate[1]) / 2 : d.sign.x + 1.2, gy = d.gate ? ir.y1 - 0.3 : ir.y0 + 0.4;
  for (let i = 0; i < n; i++) {
    const a = makeAnimal(pen.species, sex, true, clamp(gx + rand(-0.6, 0.6), ir.x0, ir.x1), clamp(gy + rand(-0.3, 0.3), ir.y0, ir.y1));
    a.wait = 0.2 + i * 0.15;
    pen.animals.push(a);
    burst(a.x, a.y - 0.3, '#fff3a0', 8);
  }
  menu.pending[sex] = 0;
}
// the trailer takes every animal in the pen away (no refund); the pen can then be used for something else
function sendAway(k) {
  const pen = state.pens[k], p = state.player;
  if (p.mode === 'horse') { const m = findMount(p.mount); if (m && m.k === k) toggleMount(); }
  for (const a of pen.animals) burst(a.x, a.y - 0.4, '#fff3a0', 6);
  Object.assign(pen, { species: PENS[k].species || null, animals: [], items: [], eggs: 0, breedT: 0 });
  buildObstacles();
  sfx('drop');
  closeMenu();
}
function upgradeCoop(k) {
  state.pens[k].coopLv++;
  buildObstacles();
  unstickAll();
  const c = coopRect(k);
  burst(c.x + c.w / 2, c.y + c.h / 2, '#fff3a0', 14, 3);
}
function buyPlot(k) {
  state.plots[k] = true;
  buildObstacles();
  unstickAll();
  eachTile(PENS[k] ? penRect(k) : patchRect(k), (x, y) => burst(x + 0.5, y + 0.5, '#fff3a0', 2));
  closeMenu();
}
function plantTree(i, kind) {
  Object.assign(state.orchard[i], { kind, age: 0, fruit: 0, t: 0 });
  buildObstacles();
  unstickAll();
  burst(SPOTS[i].x, SPOTS[i].y - 0.3, '#6dbb45', 10);
  closeMenu();
}
function removeTree(i) {
  const sp = SPOTS[i];
  burst(sp.x, sp.y - 0.6, LEAF_COLOR[state.orchard[i].kind], 14, 2.5);
  burst(sp.x, sp.y - 0.1, '#8e6b44', 8);
  Object.assign(state.orchard[i], { kind: null, age: 0, fruit: 0, t: 0 });
  buildObstacles();
  sfx('drop');
  closeMenu();
}
function upgradeBasket() {
  state.basketLv++;
  const p = state.player;
  burst(p.x, p.y - 0.8, '#fff3a0', 14, 3);
}
function holdToReset(btn, ring) {
  let start = 0, timer = 0;
  const tick = () => {
    const q = Math.min(1, (performance.now() - start) / 3000);
    ring.style.setProperty('--p', q * 100);
    if (q >= 1) { clearInterval(timer); resetFarm(); }
  };
  const stop = () => { clearInterval(timer); ring.style.setProperty('--p', 0); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); clearInterval(timer); start = performance.now(); timer = setInterval(tick, 30); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, stop);
}
let resetting = false;
function resetFarm() {
  resetting = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
}
function upgrade(a) {
  state.tractor.lv[a]++;
  const t = state.tractor;
  burst(t.x, t.y - 0.6, '#fff3a0', 14, 3);
}

// Input
// ======================================================================
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down' };
addEventListener('keydown', e => {
  ensureAudio();
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); return; }
  if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat && !menu.open) toggleMount();
    return;
  }
  if (e.code === 'Escape') closeMenu();
  if (DEV && e.code === 'KeyM') state.coins += 50;
  if (DEV && e.code === 'KeyG') for (const pk in PATCHES) for (const key in state.patches[pk].tiles) if (state.patches[pk].tiles[key] >= 0) state.patches[pk].tiles[key] = 1;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
  if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') e.preventDefault();
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('contextmenu', e => e.preventDefault());

function hitTargets() {
  const T2 = [];
  for (const k in PENS) {
    const d = PENS[k].troughs;
    if (d && owned(k)) T2.push({ id: 'trough-' + k, r: { x: d.x - 0.15, y: d.y - 0.9, w: 2.1, h: 1.4 }, act: () => openMenu('trough', k) });
  }
  for (const k in PATCHES) { const s = PATCHES[k].sign; T2.push({ id: 'crop-' + k, r: { x: s.x - 0.55, y: s.y - 1.3, w: 1.1, h: 1.35 }, act: () => openMenu(owned(k) ? 'crop' : 'plot', k) }); }
  for (const k in PENS) { const s = PENS[k].sign; T2.push({ id: 'pen-' + k, r: { x: s.x - 0.55, y: s.y - 1.3, w: 1.1, h: 1.35 }, act: () => openMenu(owned(k) ? 'pen' : 'plot', k) }); }
  SPOTS.forEach((sp, i) => {
    const r = state.orchard[i].kind ? { x: sp.x - 0.7, y: sp.y - 1.9, w: 1.4, h: 2.0 } : { x: sp.x - 0.6, y: sp.y - 0.8, w: 1.2, h: 1.0 };
    T2.push({ id: 'spot-' + i, r, act: () => openMenu('tree', i) });
  });
  T2.push({ id: 'house', r: { x: HOUSE.x + 0.2, y: HOUSE.y - 1.6, w: HOUSE.w - 0.4, h: HOUSE.h + 1.6 }, act: () => openMenu('house') });
  T2.push({ id: 'shed', r: { x: SHED.x + 0.2, y: SHED.y - 1.3, w: SHED.w - 0.4, h: SHED.h + 1.3 }, act: () => openMenu('repair') });
  return T2;
}
function hitTest(cx, cy) {
  const x = (cx - VW / 2) / S + cam.x, y = (cy - VH / 2) / S + cam.y;
  for (const t of hitTargets()) if (inRect(x, y, t.r)) return t;
  return null;
}
cv.addEventListener('pointermove', e => { const h = hitTest(e.clientX, e.clientY); hoverId = h ? h.id : null; cv.style.cursor = h ? 'pointer' : 'default'; });
cv.addEventListener('pointerdown', e => { ensureAudio(); const h = hitTest(e.clientX, e.clientY); if (h) h.act(); });

const SVG_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="#4a3010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#4a3010"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SVG_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#4a3010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#4a3010"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
const SVG_FULL = '<svg viewBox="0 0 24 24" fill="none" stroke="#4a3010" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';

// ======================================================================
// Touch screens: the pad works like the arrow keys, the round button like Enter.
// ======================================================================
const pad = document.getElementById('pad'), knob = document.getElementById('padKnob'), enterBtn = document.getElementById('enterBtn');
let padId = null;
function enableTouch() { document.body.classList.add('touch'); }
if (matchMedia('(pointer: coarse)').matches) enableTouch();
addEventListener('pointerdown', e => { if (e.pointerType === 'touch') enableTouch(); }, { capture: true });
addEventListener('touchstart', enableTouch, { capture: true, passive: true });
function padSet(e) {
  const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  keys.left = keys.right = keys.up = keys.down = false;
  if (d > 12) {
    const nx = dx / d, ny = dy / d;
    if (nx > 0.38) keys.right = true; else if (nx < -0.38) keys.left = true;
    if (ny > 0.38) keys.down = true; else if (ny < -0.38) keys.up = true;
  }
  const k = Math.min(d, r.width * 0.3) / (d || 1);
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
}
function padEnd(e) {
  if (e.pointerId !== padId) return;
  padId = null;
  keys.left = keys.right = keys.up = keys.down = false;
  knob.style.transform = '';
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (err) {} padSet(e); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padSet(e); });
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);
enterBtn.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (!menu.open) toggleMount(); });

{ const g0 = g; g = coinIcon.getContext('2d'); const d = Math.min(2, devicePixelRatio || 1); coinIcon.width = coinIcon.height = 56 * d; g.setTransform(56 * d, 0, 0, 56 * d, 28 * d, 28 * d); ICON.coin(); g = g0; }
cam.x = state.player.x; cam.y = state.player.y - 0.5; clampCam();

setInterval(saveGame, 5000);
addEventListener('pagehide', saveGame);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!document.hidden) {
    update(dt);
    draw();
    if (DEV) { fpsN++; fpsT += dt; if (fpsT > 1) { fpsShown = fpsN; fpsN = 0; fpsT = 0; } }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
